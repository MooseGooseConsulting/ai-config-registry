[project]
name = "ai-config-registry"
version = "0.1.0"
description = "Local AI tooling configuration registry scanner and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "bandit>=1.8", "pip-audit>=2.9", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
# Fleet release-age soak (MooseGooseConsulting/renovate-config ADR 0001): resolve only
# releases at least 4 days old, in Renovate lock updates and in a local `uv lock`.
exclude-newer = "4 days"
