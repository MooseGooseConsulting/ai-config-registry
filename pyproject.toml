[project]
name = "ai-config-registry"
version = "0.1.0"
description = "Local AI tooling configuration registry scanner and dashboard"
readme = "README.md"
requires-python = ">=3.11"
dependencies = []

[project.optional-dependencies]
dev = ["pytest>=8.0", "bandit>=1.8", "pip-audit>=2.9", "pyyaml>=6.0"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["scripts"]

[tool.uv]
# Fleet release-age soak (MooseGooseConsulting/renovate-config ADR 0001): resolve only
# files uploaded at least 4 days ago, in Renovate lock updates and in a local `uv lock`.
# Needs uv 0.9.17 or later. For a security fix younger than 4 days, add
# `exclude-newer-package = { <name> = false }` until that release is 4 days old.
exclude-newer = "4 days"
