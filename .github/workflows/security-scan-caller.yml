# Tier 1 secret + dependency scanning (inlined from coldaine-ci tier1/security-scan.yml).
# coldaine-ci is private; reusable workflow_call is unavailable to this public repo.
# Merge gate: security / summarize

name: tier1-security-scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tier1-security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    name: security / secret-guard
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # pin: actions/checkout@v6.0.3
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository secret guard
        run: python scripts/secret_guard.py --all-files

  # gitleaks was removed on 2026-08-14. gitleaks-action refuses to run for
  # organization accounts without a paid license ("[MooseGooseConsulting] is an
  # organization. License key is required." -- see
  # https://github.com/gitleaks/gitleaks-action#-announcement). It had been
  # failing every PR since 2026-08-10 and can never pass on a free plan, so it
  # was blocking `security / summarize`, the actual merge gate.
  #
  # Coverage is retained: the trufflehog job below scans the same commits for
  # leaked credentials, and secret-guard + semgrep-secrets still run. This
  # matches the precedent already set in MooseGooseConsulting/screenpipe, which
  # hit the identical wall and replaced gitleaks with TruffleHog.

  trufflehog:
    name: security / trufflehog
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # pin: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Run TruffleHog (verified + unknown, fail on finding)
        uses: trufflesecurity/trufflehog@d411fff7b8879a62509f3fa98c07f247ac089a51  # pin: trufflesecurity/trufflehog@v3.95.5
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  dependency-review:
    name: security / dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # pin: actions/checkout@v6.0.3

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # pin: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  summarize:
    name: security / summarize
    needs: [secret-guard, trufflehog, dependency-review]
    if: always()
    runs-on: ${{ (github.event.pull_request.head.repo.fork || vars.CI_FORCE_HOSTED == 'true') && 'ubuntu-latest' || 'moosegoose-general' }}
    steps:
      - name: Security scan summary
        env:
          SECRET_GUARD: ${{ needs.secret-guard.result }}
          TRUFFLEHOG: ${{ needs.trufflehog.result }}
          DEPREVIEW: ${{ needs.dependency-review.result }}
        run: |
          echo "## Tier 1 Security Scan"
          echo "| Scanner | Status |"
          echo "| --- | --- |"
          echo "| secret-guard | ${SECRET_GUARD} |"
          echo "| trufflehog | ${TRUFFLEHOG} |"
          echo "| dependency-review | ${DEPREVIEW:-skipped} |"
          for status in "$SECRET_GUARD" "$TRUFFLEHOG"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              exit 1
            fi
          done
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$DEPREVIEW" = "failure" ] || [ "$DEPREVIEW" = "cancelled" ]; then
              exit 1
            fi
          fi
