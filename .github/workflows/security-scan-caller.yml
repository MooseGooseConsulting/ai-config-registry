# Tier 1 secret + dependency scanning (inlined from coldaine-ci tier1/security-scan.yml).
# coldaine-ci is private; reusable workflow_call is unavailable to this public repo.
# Merge gate: security / summarize

name: tier1-security-scan

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: tier1-security-scan-${{ github.ref }}
  cancel-in-progress: true

jobs:
  secret-guard:
    name: security / secret-guard
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin: actions/checkout@v7.0.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Run repository secret guard
        run: python scripts/secret_guard.py --all-files

  gitleaks:
    name: security / gitleaks
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e  # pin: gitleaks/gitleaks-action@v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  trufflehog:
    name: security / trufflehog
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Run TruffleHog (verified + unknown, fail on finding)
        uses: trufflesecurity/trufflehog@30d5bb91af1a771378349dbbb0c82129392acf70  # pin: trufflesecurity/trufflehog@v3.95.6
        with:
          path: ./
          base: ${{ github.event.pull_request.base.sha || github.event.before }}
          head: ${{ github.event.pull_request.head.sha || github.sha }}
          extra_args: --results=verified,unknown

  dependency-review:
    name: security / dependency-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin: actions/checkout@v7.0.0

      - name: Dependency Review
        uses: actions/dependency-review-action@a1d282b36b6f3519aa1f3fc636f609c47dddb294  # pin: actions/dependency-review-action@v5.0.0
        with:
          fail-on-severity: high

  summarize:
    name: security / summarize
    needs: [secret-guard, gitleaks, trufflehog, dependency-review]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Security scan summary
        env:
          SECRET_GUARD: ${{ needs.secret-guard.result }}
          GITLEAKS: ${{ needs.gitleaks.result }}
          TRUFFLEHOG: ${{ needs.trufflehog.result }}
          DEPREVIEW: ${{ needs.dependency-review.result }}
        run: |
          echo "## Tier 1 Security Scan"
          echo "| Scanner | Status |"
          echo "| --- | --- |"
          echo "| secret-guard | ${SECRET_GUARD} |"
          echo "| gitleaks | ${GITLEAKS} |"
          echo "| trufflehog | ${TRUFFLEHOG} |"
          echo "| dependency-review | ${DEPREVIEW:-skipped} |"
          for status in "$SECRET_GUARD" "$GITLEAKS" "$TRUFFLEHOG"; do
            if [ "$status" = "failure" ] || [ "$status" = "cancelled" ]; then
              exit 1
            fi
          done
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            if [ "$DEPREVIEW" = "failure" ] || [ "$DEPREVIEW" = "cancelled" ]; then
              exit 1
            fi
          fi
