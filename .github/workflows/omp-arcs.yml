name: omp-arcs
on:
  pull_request:
    paths: ['profiles/omp-arcs/**', '.github/workflows/omp-arcs.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  native-patch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6
        with:
          bun-version: '1.4.2'
      - name: Check out the inspected OMP source
        run: node profiles/omp-arcs/bootstrap.mjs "$RUNNER_TEMP/omp-arcs-upstream"
      - name: Apply native judge-to-advisor patch
        run: node profiles/omp-arcs/native/apply.mjs "$RUNNER_TEMP/omp-arcs-upstream/omp"
      - name: Install pinned OMP workspace dependencies
        run: cd "$RUNNER_TEMP/omp-arcs-upstream/omp" && bun install --frozen-lockfile
      - name: Test periodic gate semantics
        run: cd "$RUNNER_TEMP/omp-arcs-upstream/omp" && bun test packages/coding-agent/test/advisor/periodic-gate.test.ts
      - name: Typecheck coding-agent with native patch
        run: cd "$RUNNER_TEMP/omp-arcs-upstream/omp/packages/coding-agent" && bun run check:types
      - name: Capture transplant diff
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles/omp-arcs/build
          cd "$RUNNER_TEMP/omp-arcs-upstream/omp"
          git diff --binary > "$GITHUB_WORKSPACE/profiles/omp-arcs/build/omp-native-periodic-advisor.patch"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: omp-native-periodic-advisor
          path: profiles/omp-arcs/build/omp-native-periodic-advisor.patch
          if-no-files-found: error
          retention-days: 14

  architecture:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10
        with:
          persist-credentials: false
      - name: Check out inspected OMP and Archify sources
        run: node profiles/omp-arcs/bootstrap.mjs "$RUNNER_TEMP/omp-arcs-upstream"
      - name: Install Archify from its committed dependency lock
        run: npm ci --prefix "$RUNNER_TEMP/omp-arcs-upstream/archify/archify"
      - name: Render and validate the actual Archify diagram
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p profiles/omp-arcs/build
          node "$RUNNER_TEMP/omp-arcs-upstream/archify/archify/bin/archify.mjs" finalize architecture             profiles/omp-arcs/architecture.json profiles/omp-arcs/build/omp-arcs.html             --quality showcase --json | tee profiles/omp-arcs/build/finalize.json
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: omp-arcs-architecture
          path: profiles/omp-arcs/build/
          if-no-files-found: error
          retention-days: 14
