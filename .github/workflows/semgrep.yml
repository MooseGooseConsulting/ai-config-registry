# Semgrep SAST — secrets ruleset. Merge gate: semgrep-secrets / semgrep-secrets.

name: semgrep-secrets

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-secrets:
    name: semgrep-secrets / semgrep-secrets
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.85.0
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # pin: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Semgrep p/secrets
        run: |
          semgrep scan \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Semgrep p/python
        run: |
          semgrep scan \
            --config p/python \
            --error \
            scripts/

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@aa578102511db1f4524ed59b8cc2bae4f6e88195  # pin: github/codeql-action/upload-sarif@v3.27.6
        with:
          sarif_file: semgrep.sarif
          category: semgrep-secrets
