# Semgrep SAST — secrets ruleset. Merge gate: semgrep-secrets / semgrep-secrets.

name: semgrep-secrets

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-secrets:
    name: semgrep-secrets / semgrep-secrets
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.176.0@sha256:12672acdb0949e19f9f6a4c2b288edd0b404f268f0ca7738a2c06f372f50362e
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10  # pin: actions/checkout@v6.0.3
        with:
          fetch-depth: 0

      - name: Semgrep p/secrets
        run: |
          semgrep scan \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Semgrep p/python
        run: |
          semgrep scan \
            --config p/python \
            --error \
            scripts/

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # pin: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-secrets
