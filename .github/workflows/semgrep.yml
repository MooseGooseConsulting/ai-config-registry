# Semgrep SAST — secrets ruleset. Merge gate: semgrep-secrets / semgrep-secrets.

name: semgrep-secrets

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-secrets:
    name: semgrep-secrets / semgrep-secrets
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.85.0
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # pin: actions/checkout@v7.0.0
        with:
          fetch-depth: 0

      - name: Semgrep p/secrets
        run: |
          semgrep scan \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Semgrep p/python
        run: |
          semgrep scan \
            --config p/python \
            --error \
            scripts/

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@8aad20d150bbac5944a9f9d289da16a4b0d87c1e  # pin: github/codeql-action/upload-sarif@v4.36.2
        with:
          sarif_file: semgrep.sarif
          category: semgrep-secrets
