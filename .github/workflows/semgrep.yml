# Semgrep SAST — secrets ruleset. Merge gate: semgrep-secrets / semgrep-secrets.

name: semgrep-secrets

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: semgrep-${{ github.ref }}
  cancel-in-progress: true

jobs:
  semgrep-secrets:
    name: semgrep-secrets / semgrep-secrets
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep:1.85.0
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # pin: actions/checkout@v7.0.1
        with:
          fetch-depth: 0

      - name: Semgrep p/secrets
        run: |
          semgrep scan \
            --config p/secrets \
            --sarif --output semgrep.sarif \
            --error \
            .

      - name: Semgrep p/python
        run: |
          semgrep scan \
            --config p/python \
            --error \
            scripts/

      - name: Upload Semgrep SARIF
        if: always() && hashFiles('semgrep.sarif') != ''
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3  # pin: github/codeql-action/upload-sarif@v4.37.6
        with:
          sarif_file: semgrep.sarif
          category: semgrep-secrets
