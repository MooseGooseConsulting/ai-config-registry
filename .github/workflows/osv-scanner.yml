# OSV vulnerability scan on uv.lock. Fails on known CVEs in locked deps.

name: osv-scanner

on:
  pull_request:
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
      - '.github/workflows/osv-scanner.yml'
  push:
    branches: [main]
    paths:
      - 'uv.lock'
      - 'pyproject.toml'
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: osv-scanner / scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@9a498708959aeaef5ef730655706c5a1df1edbc2  # v2.3.8
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: true
