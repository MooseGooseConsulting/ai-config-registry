# OSV vulnerability scan on uv.lock. Fails on known CVEs in locked deps.

name: osv-scanner

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: osv-scanner / scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@8deb546fdb875b9996d27d4950be7312dac076a1  # v2.5.0
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: true
