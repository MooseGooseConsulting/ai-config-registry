# OSV vulnerability scan on uv.lock. Fails on known CVEs in locked deps.

name: osv-scanner

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: osv-scanner / scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@b1d267aea5211fa648d9d442fa64b90dbdcbdd36  # v2.7.0
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: true
