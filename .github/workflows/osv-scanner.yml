# OSV vulnerability scan on uv.lock. Fails on known CVEs in locked deps.

name: osv-scanner

on:
  pull_request:
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '0 9 * * 1'
  workflow_dispatch:

permissions:
  actions: read
  contents: read
  security-events: write

jobs:
  scan:
    name: osv-scanner / scan
    uses: google/osv-scanner-action/.github/workflows/osv-scanner-reusable.yml@6e4298ebc4db23e847df9b2e2de2939d6f066c67  # v2.5.1
    with:
      scan-args: |-
        --lockfile=uv.lock
      fail-on-vuln: true
